services:
  db:
    image: docker.io/library/mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: local-root-password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: docker.io/library/wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./plugin/addresswise-woocommerce:/var/www/html/wp-content/plugins/addresswise-woocommerce:ro

  wpcli:
    image: docker.io/library/wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./plugin/addresswise-woocommerce:/var/www/html/wp-content/plugins/addresswise-woocommerce:ro
    entrypoint: wp

volumes:
  db_data:
  wordpress_data:
