<!doctype html>
<html lang="{language}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{heading} · Addresswise</title>
</head>
<body style="margin:0;background-color:#f5f7fb;color:#162239;font-family:Arial,sans-serif">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f5f7fb">
<tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background-color:#ffffff;border:1px solid #dce3ec;border-radius:12px">
<tr><td style="padding:28px">
<p style="margin:0 0 24px;color:#2454d6;font-size:20px;line-height:1.3;font-weight:bold">Addresswise</p>
<h1 style="margin:0 0 12px;font-size:26px;line-height:1.25">{heading}</h1>
<p style="margin:0 0 24px;font-size:16px;line-height:1.55">{instruction}</p>
<table role="presentation" cellspacing="0" cellpadding="0" border="0">
<tr><td bgcolor="#2454d6" style="border-radius:7px">
<a href="{link}" style="display:inline-block;padding:13px 20px;border:1px solid #2454d6;border-radius:7px;color:#ffffff;font-size:16px;line-height:1.3;font-weight:bold;text-decoration:none">{button}</a>
</td></tr>
</table>
<p style="margin:20px 0 8px;color:#536177;font-size:14px;line-height:1.5">{expiry}</p>
<p style="margin:0 0 24px;color:#536177;font-size:14px;line-height:1.5">{unsolicited}</p>
<p style="margin:0;padding-top:16px;border-top:1px solid #dce3ec;font-size:14px"><a href="mailto:peter@addresswise.eu" style="color:#2454d6">peter@addresswise.eu</a></p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
